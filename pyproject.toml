[project]
name = "scopeguard-rag"
version = "0.1.0"
description = "Scopeguard RAG"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.14.2",
    "fastmcp>=3.4.0",
    "numpy>=2.4.6",
    "openai>=2.40.0",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "python-frontmatter>=1.3.0",
    "sentence-transformers>=5.5.1",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
